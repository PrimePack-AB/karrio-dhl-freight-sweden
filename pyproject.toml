[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "karrio_dhl_freight_sweden"
version = "2026.4"
description = "Karrio - DHL Freight Sweden Shipping Extension"
readme = "README.md"
requires-python = ">=3.11"
license = "LGPL-3.0"
authors = [
    {name = "PrimePack AB"}
]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "karrio",
]

[project.urls]
Homepage = "https://github.com/PrimePack-AB/karrio-dhl-freight-sweden"

[project.entry-points."karrio.plugins"]
dhl_freight_sweden = "karrio.plugins.dhl_freight_sweden:METADATA"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.packages.find]
exclude = ["tests.*", "tests"]
namespaces = true