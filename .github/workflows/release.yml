name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches the project version
        run: scripts/check-release-tag.sh "$GITHUB_REF_NAME"
      - name: Read the karrio fork snapshot from pyproject.toml
        id: karrio
        run: |
          ref=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["primepack"]["karrio-ref"])')
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Check out the fork SDK at the snapshot
        uses: actions/checkout@v5
        with:
          repository: Joaqim/karrio
          ref: ${{ steps.karrio.outputs.ref }}
          path: karrio-sdk
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the fork SDK and the connector
        run: pip install -e karrio-sdk/modules/sdk -e .
      - name: Run the connector test suite
        run: python -m unittest discover -f -s tests
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          KARRIO_REF: ${{ steps.karrio.outputs.ref }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --notes "Requires Joaqim/karrio $KARRIO_REF."
