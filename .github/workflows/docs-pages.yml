name: docs-pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/docs-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PrimePack-AB/starlight-docs-harness@v1.1
        with:
          repo-url: https://github.com/PrimePack-AB/karrio-dhl-freight-sweden
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
