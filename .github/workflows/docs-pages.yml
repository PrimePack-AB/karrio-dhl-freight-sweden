name: docs-pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/docs-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: PrimePack-AB/starlight-docs-harness@e04b3adb0991a23515e46588f4c1668eae9ddeda # v1.2
        with:
          repo-url: https://github.com/PrimePack-AB/karrio-dhl-freight-sweden
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
